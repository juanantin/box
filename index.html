<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Token Site — Buy $TOKEN, get $REWARD</title>
<meta name="description" content="Buy $TOKEN, get $REWARD. 1B total supply on Base chain. Every trade fuels the strategy — hold $TOKEN and earn $REWARD.">

<meta property="og:type" content="website">
<meta property="og:title" content="Token Site — Buy $TOKEN, get $REWARD">
<meta property="og:description" content="Buy $TOKEN, get $REWARD. 1B total supply on Base chain.">
<meta property="og:image" content="images/box_banner_poster.webp">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:site" content="@your_handle">
<meta name="theme-color" content="#ffffff">

<!-- favicon.ico sits at the root because browsers request /favicon.ico on their
     own, regardless of these tags. It is generated from images/favicon.png, the
     tab mark. apple-touch-icon.png comes from images/logo.png instead and has to
     be flattened onto white, because iOS renders a transparent home-screen icon
     as black. -->
<link rel="icon" href="favicon.ico?v=2" sizes="any">
<link rel="icon" type="image/png" href="images/favicon.png?v=2">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png?v=1">
<link rel="manifest" href="site.webmanifest?v=1">

<!-- Two hand-lettered faces carry the whole design: Gloria Hallelujah for the
     display type, Architects Daughter for everything else. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Gloria+Hallelujah&display=swap" rel="stylesheet">

<link rel="stylesheet" href="assets/css/styles.css?v=1">
</head>
<body>

<!-- ===================== TOP BAR ===================== -->
<header class="topbar">
  <div class="topbar__inner">

    <a class="brand" href="./" aria-label="Your Token — home">
      <img class="brand__mark" src="images/logo.png" alt="" width="1050" height="1050" decoding="async">
      <span class="brand__word">
        <span class="brand__line brand__line--blue">Your</span>
        <span class="brand__line">Token</span>
      </span>
    </a>

    <nav class="topbar__links" aria-label="Primary">

      <!-- The handle sits under the button, as its caption -->
      <span class="x-wrap">
        <a class="btn btn--icon" id="link-x" href="https://x.com/your_handle" target="_blank" rel="noopener noreferrer" aria-label="Your Token on X">
          <!-- The X mark, drawn rather than set: one heavier stroke through the
               middle and a lighter one broken across it, which is what gives the
               real mark its segmented look. -->
          <svg class="btn__icon btn__icon--drawn" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M5 4.1C8.4 7.7 12.6 12.7 19.4 20.3" stroke-width="2.5"/>
            <path d="M18.9 4.2C16.6 6.9 14.2 9.5 12.1 11.8"/>
            <path d="M10.6 13.4C8.5 15.7 6.4 17.9 4.5 19.8"/>
          </svg>
        </a>
        <span class="x-handle" id="x-handle">@your_handle</span>
      </span>

      <a class="btn btn--icon" id="link-chart" href="#" target="_blank" rel="noopener noreferrer" aria-label="Price chart">
        <!-- Drawn axes with a line climbing off them, in the same hand as the
             dashboard icons -->
        <svg class="btn__icon btn__icon--drawn" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M4.4 3.8C4.2 9 4.6 15.4 4.5 19.6C9 19.8 15.2 19.4 19.8 19.7"/>
          <path d="M7.4 16C9.2 13.4 10.3 14.8 11.9 11.5C13.3 8.9 15.5 10.3 18.7 6.3"/>
          <path d="M15.4 6C16.7 6.1 17.8 6.1 18.9 6.1C18.8 7.2 18.8 8.2 18.8 9.3"/>
        </svg>
      </a>

      <div class="ca-wrap">
        <button class="btn btn--ca" id="copy-ca" type="button" aria-label="Copy contract address">
          <span class="btn__tag">CA:</span>
          <span class="btn__addr" id="ca-short">0x00…0000</span>
          <svg class="btn__icon btn__icon--copy" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <rect x="9" y="9" width="11" height="12" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/>
            <path d="M15.5 5.5h-9A2.5 2.5 0 0 0 4 8v9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </button>

        <div class="toast" id="copy-toast" role="status" aria-live="polite">
          <svg class="toast__check" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/>
            <path d="m7.8 12.3 2.9 2.9 5.5-5.6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span id="toast-text">Copied!</span>
        </div>
      </div>

    </nav>

  </div>
</header>

<!-- ===================== HERO ===================== -->
<section class="hero" aria-label="Buy $TOKEN, get $REWARD. 1B total supply on Base chain.">
  <div class="hero__inner">
    <!-- The poster is the clip's own first frame, so poster → playback is
         seamless. The source is attached by the script below only when the
         viewer hasn't asked for reduced motion — otherwise nothing downloads
         and the poster stands in as a still header. -->
    <video
      class="hero__media" id="hero-video"
      poster="images/box_banner_poster.webp"
      width="864" height="336"
      autoplay muted loop playsinline preload="none"
      aria-label="Buy $TOKEN, get $REWARD. 1B total supply, on Base chain, holders earn $REWARD."
      data-src="images/box_banner.mp4"></video>

    <script>
      (function () {
        var v = document.getElementById('hero-video');
        var still = !window.matchMedia || window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (still) return;
        v.src = v.dataset.src;
        v.preload = 'auto';
        v.load();
      })();
    </script>
  </div>
</section>

<!-- The hand-drawn wave that opens the blue band. preserveAspectRatio="none"
     lets it stretch to any width without changing the band's height. -->
<div class="wave wave--top" aria-hidden="true">
  <svg viewBox="0 0 1440 64" preserveAspectRatio="none" focusable="false">
    <path class="wave__fill" d="M0,30 C180,6 320,4 520,24 C720,44 860,52 1040,36 C1180,24 1310,10 1440,20 L1440,64 L0,64 Z"/>
    <path class="wave__line" d="M0,30 C180,6 320,4 520,24 C720,44 860,52 1040,36 C1180,24 1310,10 1440,20"/>
  </svg>
</div>

<!-- ===================== DASHBOARD BAND ===================== -->
<main class="band">
  <div class="band__inner">

    <section class="dashboard" aria-labelledby="dash-title">
      <h1 class="dashboard__title" id="dash-title">
        Dashboard
        <svg class="underline" viewBox="0 0 300 12" preserveAspectRatio="none" aria-hidden="true" focusable="false">
          <path d="M4,8 C70,2 150,10 296,4" />
        </svg>
      </h1>

      <div class="stats" id="stats">

        <!-- Total fees collected -->
        <article class="stat" data-metric="fees">
          <span class="stat__icon" aria-hidden="true">
            <svg viewBox="0 0 40 40">
              <path d="M15.4 6.6h9.2l-2.4 4.3c5 1.8 8.6 6.3 8.6 11.5 0 6-4.9 10.4-11 10.4S8.8 28.4 8.8 22.4c0-5.2 3.6-9.7 8.6-11.5l-2-4.3Z"/>
              <path d="M23.3 18.2c-.7-1.2-2-1.9-3.6-1.9-2 0-3.4 1-3.4 2.5 0 3.3 7.1 1.8 7.1 5.2 0 1.6-1.5 2.7-3.7 2.7-1.7 0-3.1-.7-3.9-2"/>
              <path d="M19.9 14.4v13.6"/>
            </svg>
          </span>
          <div class="stat__body">
            <h2 class="stat__label">Total fees collected</h2>
            <p class="stat__value"><span data-value="feesTokens"><span class="dots" role="img" aria-label="Loading"><i></i><i></i><i></i></span></span><span class="stat__unit">$TOKEN</span></p>
            <p class="stat__sub" data-chip-for="fees"><b data-value="fees"><span class="dots" role="img" aria-label="Loading"><i></i><i></i><i></i></span></b> <span>USD</span></p>
          </div>
        </article>

        <!-- Total $REWARD distributed -->
        <article class="stat" data-metric="distributed">
          <span class="stat__icon stat__icon--logo" aria-hidden="true">
            <img src="images/logo.png" alt="" width="1050" height="1050" loading="lazy" decoding="async">
          </span>
          <div class="stat__body">
            <h2 class="stat__label">Total $REWARD distributed</h2>
            <p class="stat__value"><span data-value="distributed"><span class="dots" role="img" aria-label="Loading"><i></i><i></i><i></i></span></span><span class="stat__unit">$REWARD</span></p>
            <p class="stat__sub stat__sub--usd" data-chip-for="distributedUsd"><b data-value="distributedUsd"><span class="dots" role="img" aria-label="Loading"><i></i><i></i><i></i></span></b> <span>USD</span></p>
          </div>
        </article>

        <!-- Total holders -->
        <article class="stat" data-metric="holders">
          <span class="stat__icon" aria-hidden="true">
            <svg viewBox="0 0 40 40">
              <circle cx="14.6" cy="13.4" r="5.4"/>
              <circle cx="27.4" cy="15" r="4.2"/>
              <path d="M4.6 32.4c0-5.4 4.6-8.7 10-8.7s10 3.3 10 8.7"/>
              <path d="M27.2 24.2c4.4.3 7.4 3 7.4 7.2"/>
            </svg>
          </span>
          <div class="stat__body">
            <h2 class="stat__label">Total holders</h2>
            <p class="stat__value"><span data-value="holders"><span class="dots" role="img" aria-label="Loading"><i></i><i></i><i></i></span></span></p>
          </div>
        </article>

        <!-- Market cap -->
        <article class="stat" data-metric="marketCap">
          <span class="stat__icon" aria-hidden="true">
            <svg viewBox="0 0 40 40">
              <path d="M5 31.6h30"/>
              <path d="M7.6 26.4 15 17.6l6.4 5.6 10.6-12"/>
              <path d="M25.4 11.2h6.8v6.6"/>
            </svg>
          </span>
          <div class="stat__body">
            <h2 class="stat__label">Market cap</h2>
            <p class="stat__value"><span data-value="marketCap"><span class="dots" role="img" aria-label="Loading"><i></i><i></i><i></i></span></span></p>
          </div>
        </article>

        <!-- Liquidity -->
        <article class="stat" data-metric="liquidity">
          <span class="stat__icon" aria-hidden="true">
            <svg viewBox="0 0 40 40">
              <path d="M20 5.4c0 0 10.6 10.6 10.6 17.4A10.6 10.6 0 0 1 20 33.4 10.6 10.6 0 0 1 9.4 22.8C9.4 16 20 5.4 20 5.4Z"/>
              <path d="M14.6 23.6c0 3.1 2.2 5.4 5 5.8"/>
            </svg>
          </span>
          <div class="stat__body">
            <h2 class="stat__label">Liquidity</h2>
            <p class="stat__value"><span data-value="liquidity"><span class="dots" role="img" aria-label="Loading"><i></i><i></i><i></i></span></span></p>
          </div>
        </article>

        <!-- 24h volume -->
        <article class="stat" data-metric="volume24h">
          <span class="stat__icon" aria-hidden="true">
            <svg viewBox="0 0 40 40">
              <path d="M5 32.4h30"/>
              <rect x="8.4" y="19.4" width="6.4" height="10.6" rx="1.6"/>
              <rect x="17.2" y="10.6" width="6.4" height="19.4" rx="1.6"/>
              <rect x="26" y="15.4" width="6.4" height="14.6" rx="1.6"/>
            </svg>
          </span>
          <div class="stat__body">
            <h2 class="stat__label">24h volume</h2>
            <p class="stat__value"><span data-value="volume24h"><span class="dots" role="img" aria-label="Loading"><i></i><i></i><i></i></span></span></p>
          </div>
        </article>

      </div>

      <p class="dashboard__note" id="dash-note" aria-live="polite"></p>
    </section>

    <!-- ===================== ECOSYSTEM ===================== -->
    <section class="eco" aria-label="Ecosystem">

      <a class="eco__half" href="https://www.thestonks.exchange/" target="_blank" rel="noopener noreferrer">
        <span class="eco__kicker">Launched in</span>
        <img class="eco__logo eco__logo--stonks" src="images/stonkex_button.png" alt="Stonks.Exchange" width="550" height="112" loading="lazy" decoding="async">
      </a>

      <span class="eco__rule" aria-hidden="true"></span>

      <a class="eco__half" href="https://www.stockify.finance/" target="_blank" rel="noopener noreferrer">
        <span class="eco__kicker">Holders rewards powered by</span>
        <img class="eco__logo" src="images/stockify_logo.png" alt="Stockify" width="800" height="261" loading="lazy" decoding="async">
      </a>

    </section>

  </div>
</main>

<!-- The band closes on the same wave it opened with, mirrored. -->
<div class="wave wave--bottom" aria-hidden="true">
  <svg viewBox="0 0 1440 64" preserveAspectRatio="none" focusable="false">
    <path class="wave__fill" d="M0,34 C180,10 320,8 520,28 C720,48 860,56 1040,40 C1180,28 1310,14 1440,24 L1440,0 L0,0 Z"/>
    <path class="wave__line" d="M0,34 C180,10 320,8 520,28 C720,48 860,56 1040,40 C1180,28 1310,14 1440,24"/>
  </svg>
</div>

<footer class="foot">
  <p class="foot__fine">Not financial advice. Crypto assets are volatile — do your own research.</p>
</footer>

<!-- ?v= is the cache buster: bump BUILD in both files on every deploy,
     or a CDN will keep serving the previous config.js and app.js. -->
<script src="config.js?v=1"></script>
<script src="assets/js/app.js?v=1"></script>
</body>
</html>

name: Probe token flows

# Diagnostic, run by hand. The sandbox these changes are written in has no
# route to Base, DexScreener or GeckoTerminal, so the one question that
# matters — which token the rewards are actually paid in, and whether
# anything will price it — can only be asked from a runner that has network.
#
# Actions ▸ Probe token flows ▸ Run workflow, then read the job log.

on:
  # Also on push, because the token that drives this session cannot dispatch
  # a workflow by hand — touching either file below is how it gets run.
  push:
    paths:
      - scripts/probe.mjs
      - scripts/page-probe.mjs
      - .github/workflows/probe.yml
      # The page probe exists to test these two, so a change to either is
      # exactly when it should run.
      - assets/js/app.js
      - config.js
  workflow_dispatch:
    inputs:
      rpc_url:
        description: Base RPC endpoint
        required: false
        default: https://mainnet.base.org
      start_block:
        description: First block to scan (blank = config.js launchBlock)
        required: false
        default: ''

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Probe the chain
        env:
          RPC_URL: ${{ inputs.rpc_url }}
          START_BLOCK: ${{ inputs.start_block }}
        run: node scripts/probe.mjs

      # The other half of the question: not what the chain holds, but what the
      # page does with it. Runs the committed site in a real browser, against
      # the real network, and prints the tiles.
      - name: Probe the page
        run: |
          npm i --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
          node scripts/page-probe.mjs

      # The same page, but starting from a browser that already banked zeros —
      # the state a returning visitor is in, and the one a fresh run cannot
      # reach. Fails the build if a seeded zero is still on screen at the end.
      - name: Probe the page as a returning visitor
        env:
          SEED_ZEROS: '1'
        run: node scripts/page-probe.mjs
